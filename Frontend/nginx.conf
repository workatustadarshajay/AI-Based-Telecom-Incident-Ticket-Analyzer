# Frontend nginx: static SPA + reverse proxy for the API.
# The backend is reachable as http://api:8001 on the compose network.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API proxy — keeps the browser on a single origin (no CORS needed).
    location /api/ {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # long-running agent workflow submissions
        proxy_send_timeout 300s;
    }

    # Static assets with long cache (hashed filenames).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: hash-router paths still resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
